[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nemreport"
authors = [{ name = "Alex Guinman", email = "alex@guinman.id.au" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["energy", "NEM12", "NEM13"]
requires-python = ">=3.12"
dynamic = ["version", "description"]
dependencies = [
    "calplot>=0.1.7.5",
    "jinja2>=3.1.6",
    "nemreader>=1.0.0",
    "pandas>=3.0.2",
    "great-tables>=0.21.0",
    "polars>=1.40.0",
    "plotly>=6.7.0",
    "pydantic>=2.13.3",
    "sqlite_utils>=3.39",
    "typer>=0.24.1",
]

[project.optional-dependencies]
test = ["pytest>=2.7.3", "pytest-cov>=7.1.0"]

[project.urls]
Source = "https://github.com/aguinane/energy-report"

[project.scripts]
nemreport = "nemreport.cli:app"

[tool.pytest.ini_options]
addopts = "-ra --failed-first --showlocals --durations=3 --cov=nemreport --cov=energycharts"

[tool.coverage.run]
omit = ["*/version.py", '*/__main__.py']

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP"]
